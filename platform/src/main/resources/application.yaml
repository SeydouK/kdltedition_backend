spring:
  application:
    name: platform
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 270000
      connection-timeout: 30000
      validation-timeout: 5000
  flyway:
    enabled: true

app:
  frontend:
    base-url: ${FRONTEND_INVITE_URL:http://localhost:4200/auth/register?token=}
  jwt:
    secret: ${JWT_SECRET:R---Ej7b1WGc4LP_E6LA3dAaX6XsWrdgT-sptM6om4tuqnLi59cori8H-kmSGl6Y}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

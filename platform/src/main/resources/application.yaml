spring:
  application:
    name: platform
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: true

app:
  frontend:
    base-url: http://localhost:4200/invite/
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
